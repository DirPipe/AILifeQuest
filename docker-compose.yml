services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-lifequest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifequest_db}
      POSTGRES_USER: ${POSTGRES_USER:-lifequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifequest_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ai-lifequest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifequest} -d ${POSTGRES_DB:-lifequest_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ai-lifequest-postgres-data:
